name: Audio integration core

on:
  push:
    branches:
      - feature/sooperlooper-audio-clips
  pull_request:
    paths:
      - 'libseq66/include/audio/**'
      - 'libseq66/src/audio/**'
      - 'tests/audio/**'
      - 'doc/sooperlooper/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/audio-core.yml'

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install compiler and OSC dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ liblo-dev

      - name: Prepare focused build configuration
        run: |
          mkdir -p .ci/include .ci/bin
          cat > .ci/include/seq66-config.h <<'END'
          #define SEQ66_HAVE_LIBLO 1
          #define SEQ66_SOOPERLOOPER_SUPPORT 1
          END

      - name: Compile audio model test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp tests/audio/audio_clip_test.cpp -llo -o .ci/bin/audio_clip_test

      - name: Compile headless OSC contract test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp tests/audio/sooperlooper_osc_contract_test.cpp -llo -o .ci/bin/sooperlooper_osc_contract_test

      - name: Compile typed protocol test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp tests/audio/sooperlooper_protocol_test.cpp -llo -o .ci/bin/sooperlooper_protocol_test

      - name: Compile receiver test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp tests/audio/sooperlooper_receiver_test.cpp -llo -o .ci/bin/sooperlooper_receiver_test

      - name: Run audio model test
        run: .ci/bin/audio_clip_test

      - name: Run headless OSC contract test
        run: .ci/bin/sooperlooper_osc_contract_test

      - name: Run typed protocol test
        run: .ci/bin/sooperlooper_protocol_test

      - name: Run receiver test
        run: .ci/bin/sooperlooper_receiver_test

      - name: Compile observed-state cache test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp libseq66/src/audio/sooperlooper_observed_state.cpp tests/audio/sooperlooper_observed_state_test.cpp -llo -o .ci/bin/sooperlooper_observed_state_test

      - name: Run observed-state cache test
        run: .ci/bin/sooperlooper_observed_state_test

      - name: Compile engine monitor test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_engine_monitor.cpp tests/audio/sooperlooper_engine_monitor_test.cpp -llo -o .ci/bin/sooperlooper_engine_monitor_test

      - name: Run engine monitor test
        run: .ci/bin/sooperlooper_engine_monitor_test

      - name: Compile command confirmation test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_command_confirmation.cpp tests/audio/sooperlooper_command_confirmation_test.cpp -llo -o .ci/bin/sooperlooper_command_confirmation_test

      - name: Run command confirmation test
        run: .ci/bin/sooperlooper_command_confirmation_test

      - name: Compile subscription wire protocol test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp tests/audio/sooperlooper_subscription_test.cpp -llo -o .ci/bin/sooperlooper_subscription_test

      - name: Run subscription wire protocol test
        run: .ci/bin/sooperlooper_subscription_test

      - name: Compile fault injection test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp libseq66/src/audio/sooperlooper_observed_state.cpp libseq66/src/audio/sooperlooper_engine_monitor.cpp libseq66/src/audio/sooperlooper_command_confirmation.cpp tests/audio/sooperlooper_fault_injection_test.cpp -llo -o .ci/bin/sooperlooper_fault_injection_test

      - name: Run fault injection test
        run: .ci/bin/sooperlooper_fault_injection_test
