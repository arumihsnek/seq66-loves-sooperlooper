name: Project control plane

on:
  push:
    branches:
      - feature/sooperlooper-audio-clips
      - fork-main
    paths:
      - 'PROJECT-MANIFEST.json'
      - 'AGENTS.md'
      - 'CHANGELOG-FORK.md'
      - 'ROADMAP.md'
      - 'TODO'
      - 'doc/sooperlooper/**'
      - 'contrib/scripts/validate-project-control.py'
      - '.github/workflows/project-control.yml'
  pull_request:
    paths:
      - 'PROJECT-MANIFEST.json'
      - 'AGENTS.md'
      - 'CHANGELOG-FORK.md'
      - 'ROADMAP.md'
      - 'TODO'
      - 'doc/sooperlooper/**'
      - 'contrib/scripts/validate-project-control.py'
      - '.github/workflows/project-control.yml'

permissions:
  contents: read

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest JSON
        run: python3 -m json.tool PROJECT-MANIFEST.json > /dev/null

      - name: Validate control-file consistency
        run: python3 contrib/scripts/validate-project-control.py

      - name: Reject duplicate active planning files
        run: |
          set -eu
          unexpected="$(
            find . \
              -path './.git' -prune -o \
              -path './doc/sooperlooper/archive' -prune -o \
              -type f \( \
                -iname '*roadmap*' -o \
                -iname '*todo*' -o \
                -iname '*work-queue*' -o \
                -iname '*checkpoint*' -o \
                -iname '*manifest*' \
              \) -print \
            | sed 's#^./##' \
            | grep -Ev '^(
              PROJECT-MANIFEST\.json|
              ROADMAP\.md|
              TODO|
              doc/sooperlooper/ROADMAP\.md|
              doc/sooperlooper/WORK-QUEUE\.md|
              doc/sooperlooper/CHECKPOINTS\.md|
              doc/sooperlooper/checkpoints/CURRENT\.md|
              doc/sooperlooper/checkpoints/[0-9]{4}-[0-9]{2}-[0-9]{2}-CP-[0-9]{3}-[A-Za-z0-9._-]+\.md
            )$' \
            || true
          )"

          if test -n "$unexpected"; then
            echo 'Unexpected planning/control files found:' >&2
            echo "$unexpected" >&2
            echo 'Use the canonical files or archive superseded fork documents.' >&2
            exit 1
          fi
