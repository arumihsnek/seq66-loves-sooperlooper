name: Audio integration core

on:
  push:
    branches:
      - feature/sooperlooper-audio-clips
  pull_request:
    paths:
      - 'libseq66/include/audio/**'
      - 'libseq66/src/audio/**'
      - 'tests/audio/**'
      - 'doc/sooperlooper/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/audio-core.yml'

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install compiler and OSC dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ liblo-dev

      - name: Prepare focused build configuration
        run: |
          mkdir -p .ci/include .ci/bin
          cat > .ci/include/seq66-config.h <<'END'
          #define SEQ66_HAVE_LIBLO 1
          #define SEQ66_SOOPERLOOPER_SUPPORT 1
          END

      - name: Compile audio model test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp tests/audio/audio_clip_test.cpp -llo -o .ci/bin/audio_clip_test

      - name: Compile headless OSC contract test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp tests/audio/sooperlooper_osc_contract_test.cpp -llo -o .ci/bin/sooperlooper_osc_contract_test

      - name: Compile typed protocol test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp tests/audio/sooperlooper_protocol_test.cpp -llo -o .ci/bin/sooperlooper_protocol_test

      - name: Compile receiver test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp tests/audio/sooperlooper_receiver_test.cpp -llo -o .ci/bin/sooperlooper_receiver_test

      - name: Run audio model test
        run: .ci/bin/audio_clip_test

      - name: Run headless OSC contract test
        run: .ci/bin/sooperlooper_osc_contract_test

      - name: Run typed protocol test
        run: .ci/bin/sooperlooper_protocol_test

      - name: Run receiver test
        run: .ci/bin/sooperlooper_receiver_test

      - name: Compile observed-state cache test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp libseq66/src/audio/sooperlooper_observed_state.cpp tests/audio/sooperlooper_observed_state_test.cpp -llo -o .ci/bin/sooperlooper_observed_state_test

      - name: Run observed-state cache test
        run: .ci/bin/sooperlooper_observed_state_test

      - name: Compile engine monitor test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp libseq66/src/audio/sooperlooper_engine_monitor.cpp tests/audio/sooperlooper_engine_monitor_test.cpp -llo -o .ci/bin/sooperlooper_engine_monitor_test

      - name: Run engine monitor test
        run: .ci/bin/sooperlooper_engine_monitor_test

      - name: Compile command confirmation test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp libseq66/src/audio/sooperlooper_command_confirmation.cpp tests/audio/sooperlooper_command_confirmation_test.cpp -llo -o .ci/bin/sooperlooper_command_confirmation_test

      - name: Run command confirmation test
        run: .ci/bin/sooperlooper_command_confirmation_test

      - name: Compile subscription wire protocol test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp tests/audio/sooperlooper_subscription_test.cpp -llo -o .ci/bin/sooperlooper_subscription_test

      - name: Run subscription wire protocol test
        run: .ci/bin/sooperlooper_subscription_test

      - name: Compile fault injection test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/audio_clip.cpp libseq66/src/audio/sooperlooper_client.cpp libseq66/src/audio/sooperlooper_protocol.cpp libseq66/src/audio/sooperlooper_receiver.cpp libseq66/src/audio/sooperlooper_observed_state.cpp libseq66/src/audio/sooperlooper_engine_monitor.cpp libseq66/src/audio/sooperlooper_command_confirmation.cpp tests/audio/sooperlooper_fault_injection_test.cpp -llo -o .ci/bin/sooperlooper_fault_injection_test

      - name: Run fault injection test
        run: .ci/bin/sooperlooper_fault_injection_test

      - name: Compile backend capability probe test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_backend_probe.cpp tests/audio/sooperlooper_backend_probe_test.cpp -o .ci/bin/sooperlooper_backend_probe_test

      - name: Run backend capability probe test
        run: .ci/bin/sooperlooper_backend_probe_test

      - name: Compile process supervisor test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_process_supervisor.cpp tests/audio/sooperlooper_process_supervisor_test.cpp -o .ci/bin/sooperlooper_process_supervisor_test

      - name: Run process supervisor test
        run: .ci/bin/sooperlooper_process_supervisor_test

      - name: Compile engine launcher test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_process_supervisor.cpp libseq66/src/audio/sooperlooper_engine_launcher.cpp libseq66/src/audio/sooperlooper_observed_state.cpp libseq66/src/audio/sooperlooper_engine_monitor.cpp libseq66/src/audio/sooperlooper_protocol.cpp tests/audio/sooperlooper_engine_launcher_test.cpp -o .ci/bin/sooperlooper_engine_launcher_test

      - name: Run engine launcher test
        run: .ci/bin/sooperlooper_engine_launcher_test

      - name: Compile JACK discovery test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_engine_jack_discovery.cpp tests/audio/sooperlooper_engine_jack_discovery_test.cpp -o .ci/bin/sooperlooper_engine_jack_discovery_test

      - name: Run JACK discovery test
        run: .ci/bin/sooperlooper_engine_jack_discovery_test

      - name: Compile readiness gate test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_readiness_gate.cpp tests/audio/sooperlooper_readiness_gate_test.cpp -o .ci/bin/sooperlooper_readiness_gate_test

      - name: Run readiness gate test
        run: .ci/bin/sooperlooper_readiness_gate_test

      - name: Compile crash reconciler test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_process_supervisor.cpp libseq66/src/audio/sooperlooper_crash_reconciler.cpp tests/audio/sooperlooper_crash_reconciler_test.cpp -o .ci/bin/sooperlooper_crash_reconciler_test

      - name: Run crash reconciler test
        run: .ci/bin/sooperlooper_crash_reconciler_test

      - name: Compile lifecycle smoke test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_process_supervisor.cpp libseq66/src/audio/sooperlooper_crash_reconciler.cpp tests/audio/sooperlooper_lifecycle_smoke_test.cpp -o .ci/bin/sooperlooper_lifecycle_smoke_test

      - name: Run lifecycle smoke test
        run: .ci/bin/sooperlooper_lifecycle_smoke_test

      - name: Compile clip mapper test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_clip_mapper.cpp tests/audio/sooperlooper_clip_mapper_test.cpp -o .ci/bin/sooperlooper_clip_mapper_test

      - name: Run clip mapper test
        run: .ci/bin/sooperlooper_clip_mapper_test

      - name: Compile command dispatcher test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_command_dispatcher.cpp libseq66/src/audio/sooperlooper_clip_mapper.cpp libseq66/src/audio/sooperlooper_command_confirmation.cpp libseq66/src/audio/sooperlooper_observed_state.cpp libseq66/src/audio/sooperlooper_protocol.cpp tests/audio/sooperlooper_command_dispatcher_test.cpp -o .ci/bin/sooperlooper_command_dispatcher_test

      - name: Run command dispatcher test
        run: .ci/bin/sooperlooper_command_dispatcher_test

      - name: Compile transport tempo policy test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_transport_policy.cpp libseq66/src/audio/sooperlooper_tempo_policy.cpp tests/audio/sooperlooper_transport_tempo_policy_test.cpp -o .ci/bin/sooperlooper_transport_tempo_policy_test

      - name: Run transport tempo policy test
        run: .ci/bin/sooperlooper_transport_tempo_policy_test

      - name: Compile audio slot widget model test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_audio_slot_widget.cpp tests/audio/sooperlooper_audio_slot_widget_test.cpp -o .ci/bin/sooperlooper_audio_slot_widget_test

      - name: Run audio slot widget model test
        run: .ci/bin/sooperlooper_audio_slot_widget_test

      - name: Compile audio persistence test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_audio_slot_widget.cpp libseq66/src/audio/sooperlooper_audio_persistence.cpp tests/audio/sooperlooper_audio_persistence_test.cpp -o .ci/bin/sooperlooper_audio_persistence_test

      - name: Run audio persistence test
        run: .ci/bin/sooperlooper_audio_persistence_test

      - name: Compile audio slot view model test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -Ilibseq66/include libseq66/src/audio/sooperlooper_audio_slot_widget.cpp tests/widgets/sooperlooper_audio_slot_view_test.cpp -o .ci/bin/sooperlooper_audio_slot_view_test

      - name: Run audio slot view model test
        run: .ci/bin/sooperlooper_audio_slot_view_test

      - name: Install Qt5 dev
        run: sudo apt-get install -y qtbase5-dev libqt5test5

      - name: Generate MOC for audio slot view
        run: moc libseq66/include/widgets/sooperlooper_audio_slot_view.hpp -o /tmp/moc_view.cpp

      - name: Compile Qt widget test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fPIC -pthread -I.ci/include -Ilibseq66/include -I/tmp libseq66/src/audio/sooperlooper_audio_slot_widget.cpp libseq66/src/widgets/sooperlooper_audio_slot_view.cpp /tmp/moc_view.cpp tests/widgets/sooperlooper_audio_slot_view_qt_test.cpp $(pkg-config --cflags --libs Qt5Widgets Qt5Test) -o .ci/bin/sooperlooper_audio_slot_view_qt_test

      - name: Run Qt widget test
        run: QT_QPA_PLATFORM=offscreen .ci/bin/sooperlooper_audio_slot_view_qt_test

      - name: Generate MOC for grid adapter
        run: moc libseq66/include/widgets/sooperlooper_audio_slot_grid_adapter.hpp -o /tmp/moc_grid_adapter.cpp

      - name: Compile grid adapter test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fPIC -pthread -I.ci/include -Ilibseq66/include -I/tmp libseq66/src/audio/sooperlooper_audio_slot_widget.cpp libseq66/src/widgets/sooperlooper_audio_slot_grid_adapter.cpp /tmp/moc_grid_adapter.cpp tests/widgets/sooperlooper_audio_slot_grid_adapter_test.cpp $(pkg-config --cflags --libs Qt5Widgets) -o .ci/bin/sooperlooper_audio_slot_grid_adapter_test

      - name: Run grid adapter test
        run: QT_QPA_PLATFORM=offscreen .ci/bin/sooperlooper_audio_slot_grid_adapter_test

      - name: Compile backend gate test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_backend_gate.cpp libseq66/src/audio/sooperlooper_backend_probe.cpp tests/audio/sooperlooper_backend_gate_test.cpp -o .ci/bin/sooperlooper_backend_gate_test

      - name: Run backend gate test
        run: .ci/bin/sooperlooper_backend_gate_test

      - name: Compile audio slot controls test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_audio_slot_controls.cpp libseq66/src/audio/sooperlooper_audio_slot_widget.cpp tests/audio/sooperlooper_audio_slot_controls_test.cpp -o .ci/bin/sooperlooper_audio_slot_controls_test

      - name: Run audio slot controls test
        run: .ci/bin/sooperlooper_audio_slot_controls_test

      - name: Compile state renderer test
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I.ci/include -Ilibseq66/include libseq66/src/audio/sooperlooper_audio_slot_state_renderer.cpp libseq66/src/audio/sooperlooper_audio_slot_widget.cpp tests/audio/sooperlooper_audio_slot_state_renderer_test.cpp -o .ci/bin/sooperlooper_audio_slot_state_renderer_test

      - name: Run state renderer test
        run: .ci/bin/sooperlooper_audio_slot_state_renderer_test
